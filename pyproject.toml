[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-ai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: sends a real request to the model provider; skipped without GEMINI_API_KEY",
]

[tool.ruff]
target-version = "py311"
# macOS writes AppleDouble sidecars on non-APFS volumes; they are not source.
extend-exclude = ["._*"]
